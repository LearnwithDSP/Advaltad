<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Advaltad Growth and Support Foundation</title>
    <meta name="description" content="Official platform for Advaltad Growth and Support Foundation: youth empowerment, ambassador programs, and social impact." />
    
    <!-- PWA & Mobile Web Capabilities -->
    <meta name="theme-color" content="#0A5C36" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Advaltad" />
    <meta name="application-name" content="Advaltad Growth Foundation" />
    
    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Advaltad Growth Foundation" />
    <meta property="og:description" content="NGO Ambassador & Social web platform - Advaltad Growth and Support Foundation" />
    <meta property="og:image" content="/pwa-512x512.png" />

    <!-- Early PWA Native Prompt Listener (Captures event before React mounts) -->
    <script>
      (function() {
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__deferredPwaPrompt = e;
          window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
        });
        window.addEventListener('appinstalled', function() {
          window.__pwaInstalled = true;
          window.dispatchEvent(new CustomEvent('pwa-installed'));
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
